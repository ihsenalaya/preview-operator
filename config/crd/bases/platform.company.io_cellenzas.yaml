    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Cellenza is the Schema for the preview environment operator
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: CellenzaSpec defines the desired state
            properties:
              approvedBy:
                description: ApprovedBy is the user who approved this environment
                  (required when RequiresApproval=true)
                type: string
              branch:
                description: Branch is the git branch name for this preview environment
                minLength: 1
                type: string
              database:
                description: Database configures an ephemeral PostgreSQL instance
