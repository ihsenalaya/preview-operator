---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: previews.platform.company.io
spec:
  group: platform.company.io
  names:
    kind: Preview
    listKind: PreviewList
    plural: previews
    shortNames:
    - cz
    singular: preview
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.branch
      name: Branch
      type: string
    - jsonPath: .spec.resourceTier
      name: Tier
      type: string
    - jsonPath: .status.url
      name: URL
      type: string
    - jsonPath: .status.expiresAt
      name: Expires
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Preview is the Schema for the preview environment operator
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PreviewSpec defines the desired state
            properties:
              aiEnrichment:
                description: AIEnrichment configures AI-powered seed data and test
                  generation after deployment.
                properties:
                  apiSecretRef:
                    description: 'APISecretRef points to a Secret containing the AI
                      provider API key (key: "api-key").'
                    properties:
                      key:
                        description: Key is the Secret data key. Defaults to "api-key".
                        type: string
                      name:
                        description: Name is the Secret name.
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace is the Secret namespace. Defaults to
                          preview-operator-system.
                        type: string
                    required:
                    - name
                    type: object
                  enabled:
                    default: false
                    description: Enabled controls whether AI enrichment runs after
                      the environment is ready.
                    type: boolean
                  githubTokenSecretRef:
                    description: |-
                      GitHubTokenSecretRef points to a Secret containing a long-lived GitHub token used
                      by AI enrichment to fetch the pull request diff. When omitted, the controller falls
                      back to spec.github.tokenSecretRef for backward compatibility.
                    properties:
                      key:
                        description: Key is the Secret data key containing the token.
                          Defaults to "token".
                        type: string
                      name:
                        description: Name is the Secret name.
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace is the Secret namespace. When empty,
                          the controller namespace is used.
                        type: string
                    required:
                    - name
                    type: object
                  model:
                    default: gpt-4o-mini
                    description: Model is the AI model to use (e.g. "gpt-4o-mini",
                      "gpt-4o").
                    type: string
                  rerunRequested:
                    description: |-
                      RerunRequested triggers an AI-only rerun: database migration/seed are replayed
                      when enabled, AI artifacts are regenerated, and the standard test suite is skipped
                      for that cycle. The operator clears this flag automatically once the rerun completes.
                    type: boolean
                  seed:
                    description: |-
                      Seed configures AI seed data generation and execution.
                      When omitted while AI enrichment is enabled, the operator treats this task as enabled.
                    properties:
                      enabled:
                        default: true
                        description: |-
                          Enabled controls whether this task runs.
                          When omitted, the task runs by default while AI enrichment is enabled.
                          Explicitly set it to false to disable a task while keeping AI enrichment enabled.
                        type: boolean
                      image:
                        description: |-
                          Image is the container image used to run the task.
                          Defaults to "postgres:15-alpine" for seed, "python:3.12-slim" for tests.
                        type: string
                    type: object
                  tests:
                    description: |-
                      Tests configures AI test generation and execution.
                      When omitted while AI enrichment is enabled, the operator treats this task as enabled.
                    properties:
                      enabled:
                        default: true
                        description: |-
                          Enabled controls whether this task runs.
                          When omitted, the task runs by default while AI enrichment is enabled.
                          Explicitly set it to false to disable a task while keeping AI enrichment enabled.
                        type: boolean
                      image:
                        description: |-
                          Image is the container image used to run the task.
                          Defaults to "postgres:15-alpine" for seed, "python:3.12-slim" for tests.
                        type: string
                    type: object
                type: object
              approvedBy:
                description: ApprovedBy is the user who approved this environment
                  (required when RequiresApproval=true)
                type: string
              branch:
                description: Branch is the git branch name for this preview environment
                minLength: 1
                type: string
              database:
                description: Database configures an ephemeral PostgreSQL instance
                  for this environment
                properties:
                  checkpointRestore:
                    description: |-
                      CheckpointRestore, if set, triggers a restore from the named snapshot.
                      The operator clears this field after the Job completes.
                    type: string
                  checkpointSave:
                    description: |-
                      CheckpointSave, if set, triggers a pg_dump snapshot saved under this name.
                      The operator clears this field after the Job completes.
                    type: string
                  databaseName:
                    default: appdb
                    description: DatabaseName is the logical database created inside
                      PostgreSQL
                    type: string
                  enabled:
                    default: false
                    description: Enabled controls whether a PostgreSQL instance is
                      provisioned alongside the app
                    type: boolean
                  migration:
                    description: |-
                      Migration configures an optional one-shot Job that runs before the app is deployed.
                      The operator injects POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB and DATABASE_URL.
                    properties:
                      args:
                        description: Args are optional arguments passed to the command.
                        items:
                          type: string
                        type: array
                      command:
                        description: Command is the entrypoint command for the task.
                        items:
                          type: string
                        type: array
                      enabled:
                        default: false
                        description: Enabled controls whether this database task is
                          executed.
                        type: boolean
                      image:
                        description: Image is the container image used to run the
                          task. When empty, spec.image is used.
                        type: string
                    type: object
                  resetRequested:
                    description: |-
                      ResetRequested triggers a database reset: migration and seed jobs are deleted and re-run.
                      The operator clears this flag automatically after the reset is initiated.
                    type: boolean
                  seed:
                    description: |-
                      Seed configures an optional one-shot Job that runs after migration and before the app is deployed.
                      The operator injects POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB and DATABASE_URL.
                    properties:
                      args:
                        description: Args are optional arguments passed to the command.
                        items:
                          type: string
                        type: array
                      command:
                        description: Command is the entrypoint command for the task.
                        items:
                          type: string
                        type: array
                      enabled:
                        default: false
                        description: Enabled controls whether this database task is
                          executed.
                        type: boolean
                      image:
                        description: Image is the container image used to run the
                          task. When empty, spec.image is used.
                        type: string
                    type: object
                  version:
                    default: "15"
                    description: Version is the PostgreSQL major version to use (e.g.
                      "15", "16")
                    type: string
                type: object
              github:
                description: GitHub configures optional GitHub Deployment and pull
                  request updates.
                properties:
                  commentOnReady:
                    default: false
                    description: CommentOnReady controls whether the controller comments
                      on the PR when the preview is ready.
                    type: boolean
                  deploymentId:
                    description: DeploymentID is the GitHub Deployment id to update.
                    format: int64
                    type: integer
                  enabled:
                    default: false
                    description: Enabled controls whether the controller sends updates
                      to GitHub.
                    type: boolean
                  environment:
                    description: Environment is the GitHub Deployment environment
                      name (for example "pr-42").
                    type: string
                  owner:
                    description: Owner is the GitHub repository owner or organization.
                    type: string
                  repo:
                    description: Repo is the GitHub repository name.
                    type: string
                  tokenSecretRef:
                    description: TokenSecretRef points to a Secret containing a GitHub
                      token.
                    properties:
                      key:
                        description: Key is the Secret data key containing the token.
                          Defaults to "token".
                        type: string
                      name:
                        description: Name is the Secret name.
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace is the Secret namespace. When empty,
                          the controller namespace is used.
                        type: string
                    required:
                    - name
                    type: object
                type: object
              image:
                description: Image is the container image to deploy
                minLength: 1
                type: string
              prNumber:
                description: PRNumber is the pull request number
                type: integer
              replicas:
                default: 1
                description: Replicas for the preview deployment
                format: int32
                maximum: 5
                minimum: 1
                type: integer
              requiresApproval:
                default: false
                description: RequiresApproval blocks provisioning until ApprovedBy
                  is set
                type: boolean
              resourceTier:
                default: medium
                description: ResourceTier controls CPU/Memory quotas
                enum:
                - small
                - medium
                - large
                type: string
              services:
                description: |-
                  Services defines multiple containers to deploy (e.g. a frontend and a backend).
                  When non-empty, spec.image is ignored; each entry gets its own Deployment, Service, and
                  optional ingress path. All other add-ons (database, telemetry, AI enrichment, test suite) continue to work.
                items:
                  description: ServiceSpec configures one service (e.g. frontend,
                    backend) in a multi-service environment.
                  properties:
                    env:
                      description: Env contains additional environment variables to
                        inject into this service's container.
                      items:
                        description: EnvVar represents an environment variable present
                          in a Container.
                        properties:
                          name:
                            description: |-
                              Name of the environment variable.
                              May consist of any printable ASCII characters except '='.
                            type: string
                          value:
                            description: |-
                              Variable references $(VAR_NAME) are expanded
                              using the previously defined environment variables in the container and
                              any service environment variables. If a variable cannot be resolved,
                              the reference in the input string will be unchanged. Double $$ are reduced
                              to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                              "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                              Escaped references will never be expanded, regardless of whether the variable
                              exists or not.
                              Defaults to "".
                            type: string
                          valueFrom:
                            description: Source for the environment variable's value.
                              Cannot be used if value is not empty.
                            properties:
                              configMapKeyRef:
                                description: Selects a key of a ConfigMap.
                                properties:
                                  key:
                                    description: The key to select.
                                    type: string
                                  name:
                                    default: ""
                                    description: |-
                                      Name of the referent.
                                      This field is effectively required, but due to backwards compatibility is
                                      allowed to be empty. Instances of this type with an empty value here are
                                      almost certainly wrong.
                                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                    type: string
                                  optional:
                                    description: Specify whether the ConfigMap or
                                      its key must be defined
                                    type: boolean
                                required:
                                - key
                                type: object
                                x-kubernetes-map-type: atomic
                              fieldRef:
                                description: |-
                                  Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                                  spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                                properties:
                                  apiVersion:
                                    description: Version of the schema the FieldPath
                                      is written in terms of, defaults to "v1".
                                    type: string
                                  fieldPath:
                                    description: Path of the field to select in the
                                      specified API version.
                                    type: string
                                required:
                                - fieldPath
                                type: object
                                x-kubernetes-map-type: atomic
                              fileKeyRef:
                                description: |-
                                  FileKeyRef selects a key of the env file.
                                  Requires the EnvFiles feature gate to be enabled.
                                properties:
                                  key:
                                    description: |-
                                      The key within the env file. An invalid key will prevent the pod from starting.
                                      The keys defined within a source may consist of any printable ASCII characters except '='.
                                      During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                                    type: string
                                  optional:
                                    default: false
                                    description: |-
                                      Specify whether the file or its key must be defined. If the file or key
                                      does not exist, then the env var is not published.
                                      If optional is set to true and the specified key does not exist,
                                      the environment variable will not be set in the Pod's containers.

                                      If optional is set to false and the specified key does not exist,
                                      an error will be returned during Pod creation.
                                    type: boolean
                                  path:
                                    description: |-
                                      The path within the volume from which to select the file.
                                      Must be relative and may not contain the '..' path or start with '..'.
                                    type: string
                                  volumeName:
                                    description: The name of the volume mount containing
                                      the env file.
                                    type: string
                                required:
                                - key
                                - path
                                - volumeName
                                type: object
                                x-kubernetes-map-type: atomic
                              resourceFieldRef:
                                description: |-
                                  Selects a resource of the container: only resources limits and requests
                                  (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                                properties:
                                  containerName:
                                    description: 'Container name: required for volumes,
                                      optional for env vars'
                                    type: string
                                  divisor:
                                    anyOf:
                                    - type: integer
                                    - type: string
                                    description: Specifies the output format of the
                                      exposed resources, defaults to "1"
                                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                    x-kubernetes-int-or-string: true
                                  resource:
                                    description: 'Required: resource to select'
                                    type: string
                                required:
                                - resource
                                type: object
                                x-kubernetes-map-type: atomic
                              secretKeyRef:
                                description: Selects a key of a secret in the pod's
                                  namespace
                                properties:
                                  key:
                                    description: The key of the secret to select from.  Must
                                      be a valid secret key.
                                    type: string
                                  name:
                                    default: ""
                                    description: |-
                                      Name of the referent.
                                      This field is effectively required, but due to backwards compatibility is
                                      allowed to be empty. Instances of this type with an empty value here are
                                      almost certainly wrong.
                                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                    type: string
                                  optional:
                                    description: Specify whether the Secret or its
                                      key must be defined
                                    type: boolean
                                required:
                                - key
                                type: object
                                x-kubernetes-map-type: atomic
                            type: object
                        required:
                        - name
                        type: object
                      type: array
                    image:
                      description: Image is the container image to deploy for this
                        service.
                      minLength: 1
                      type: string
                    name:
                      description: Name is the unique identifier for this service
                        (e.g. "frontend", "backend").
                      minLength: 1
                      type: string
                    pathPrefix:
                      description: |-
                        PathPrefix is the URL path routed to this service via the ingress (e.g. "/" or "/api").
                        Services without a PathPrefix are deployed but not exposed through the shared ingress.
                      type: string
                    port:
                      default: 80
                      description: Port is the container port exposed by this service.
                        Defaults to 80.
                      format: int32
                      type: integer
                    replicas:
                      description: Replicas is the number of Pod replicas. Defaults
                        to spec.replicas when unset.
                      format: int32
                      maximum: 5
                      minimum: 1
                      type: integer
                  required:
                  - image
                  - name
                  type: object
                type: array
              telemetry:
                description: Telemetry configures application observability integration.
                properties:
                  autoInstrumentation:
                    description: AutoInstrumentation configures OpenTelemetry Operator
                      auto-instrumentation.
                    properties:
                      goTargetExecutable:
                        description: |-
                          GoTargetExecutable is required by OpenTelemetry Go auto-instrumentation.
                          It must point to the executable inside the application container.
                        type: string
                      instrumentationRef:
                        description: |-
                          InstrumentationRef is the Instrumentation resource used by the OpenTelemetry Operator.
                          It can be "true", a name in the app namespace, or "namespace/name".
                          When empty, the controller uses "true".
                        type: string
                      language:
                        description: Language is the runtime to auto-instrument.
                        enum:
                        - python
                        - java
                        - nodejs
                        - dotnet
                        - go
                        - sdk
                        type: string
                      pythonPlatform:
                        description: |-
                          PythonPlatform selects the Python auto-instrumentation platform.
                          Use "musl" for Alpine-based Python images when supported by the OpenTelemetry Operator.
                        enum:
                        - glibc
                        - musl
                        type: string
                    required:
                    - language
                    type: object
                  enabled:
                    default: false
                    description: Enabled controls whether telemetry settings are added
                      to the app Pod template.
                    type: boolean
                  serviceName:
                    description: |-
                      ServiceName sets OTEL_SERVICE_NAME for the application.
                      When empty, the controller uses "preview-<resource-name>".
                    type: string
                type: object
              testSuite:
                description: TestSuite configures automated smoke, regression, and
                  E2E tests run after deployment.
                properties:
                  e2e:
                    description: |-
                      E2E configures the end-to-end test job (full user flows).
                      Default command: sh -c "pip install requests -q && python /app/tests/e2e.py"
                    properties:
                      command:
                        description: Command overrides the default command used to
                          run the tests.
                        items:
                          type: string
                        type: array
                      enabled:
                        default: true
                        description: Enabled controls whether this test type runs.
                        type: boolean
                      image:
                        description: Image overrides the container image. Defaults
                          to the app image.
                        type: string
                    type: object
                  enabled:
                    default: false
                    description: Enabled controls whether the test suite runs after
                      the environment is ready.
                    type: boolean
                  regression:
                    description: |-
                      Regression configures the regression test job (existing endpoints).
                      Default command: sh -c "pip install requests -q && python /app/tests/regression.py"
                    properties:
                      command:
                        description: Command overrides the default command used to
                          run the tests.
                        items:
                          type: string
                        type: array
                      enabled:
                        default: true
                        description: Enabled controls whether this test type runs.
                        type: boolean
                      image:
                        description: Image overrides the container image. Defaults
                          to the app image.
                        type: string
                    type: object
                  smoke:
                    description: Smoke configures the smoke test job (health check
                      endpoints).
                    properties:
                      command:
                        description: Command overrides the default command used to
                          run the tests.
                        items:
                          type: string
                        type: array
                      enabled:
                        default: true
                        description: Enabled controls whether this test type runs.
                        type: boolean
                      image:
                        description: Image overrides the container image. Defaults
                          to the app image.
                        type: string
                    type: object
                type: object
              ttl:
                default: 48h
                description: TTL is the time-to-live duration (e.g. "48h", "24h",
                  "72h")
                pattern: ^[0-9]+(h|m)$
                type: string
            required:
            - branch
            - image
            - prNumber
            type: object
          status:
            description: PreviewStatus defines the observed state
            properties:
              aiEnrichment:
                description: AIEnrichment describes the observed AI enrichment state.
                properties:
                  completedAt:
                    description: CompletedAt is when the enrichment completed.
                    format: date-time
                    type: string
                  error:
                    description: Error stores the latest enrichment error message.
                    type: string
                  phase:
                    description: 'Phase: Pending | Generating | Running | Succeeded
                      | Failed'
                    type: string
                  rerunOnly:
                    description: RerunOnly is true while an AI-only rerun is in progress.
                    type: boolean
                  seedStatus:
                    description: 'SeedStatus: Skipped | Running | Succeeded | Failed'
                    type: string
                  summary:
                    description: Summary is a human-readable enrichment summary for
                      the PR comment.
                    type: string
                  testResults:
                    description: TestResults contains stdout lines from the test job.
                    items:
                      type: string
                    type: array
                  testsStatus:
                    description: 'TestsStatus: Skipped | Running | Succeeded | Failed'
                    type: string
                type: object
              conditions:
                description: Conditions represent the latest available observations
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              database:
                description: Database describes the observed PostgreSQL and database
                  task state.
                properties:
                  checkpoints:
                    description: Checkpoints lists the saved snapshot names available
                      for restore.
                    items:
                      type: string
                    type: array
                  databaseName:
                    description: DatabaseName is the logical PostgreSQL database name.
                    type: string
                  host:
                    description: Host is the in-cluster PostgreSQL service hostname.
                    type: string
                  migration:
                    description: Migration is the latest observed migration task state.
                    type: string
                  ready:
                    description: Ready is true when the database resources and configured
                      tasks are complete.
                    type: boolean
                  secretName:
                    description: SecretName is the Secret containing database credentials.
                    type: string
                  seed:
                    description: Seed is the latest observed seed task state.
                    type: string
                type: object
              databaseSecretName:
                description: DatabaseSecretName is the name of the Secret holding
                  PostgreSQL credentials (when database is enabled)
                type: string
              diagnostics:
                description: Diagnostics describes the latest operator-generated troubleshooting
                  summary.
                properties:
                  component:
                    description: Component identifies the component most likely responsible
                      for the issue.
                    type: string
                  confidence:
                    description: 'Confidence estimates how strong the diagnostic signal
                      is: low, medium, or high.'
                    type: string
                  debugCommands:
                    description: DebugCommands contains useful kubectl commands for
                      troubleshooting.
                    items:
                      type: string
                    type: array
                  lastEvents:
                    description: LastEvents contains recent warning events related
                      to the preview namespace.
                    items:
                      type: string
                    type: array
                  message:
                    description: Message is a concise human-readable summary.
                    type: string
                  podLogs:
                    description: PodLogs contains the last lines of the crashed application
                      pod.
                    items:
                      type: string
                    type: array
                  reason:
                    description: Reason is a short machine-readable reason.
                    type: string
                  recommendations:
                    description: Recommendations contains suggested next actions for
                      the developer.
                    items:
                      type: string
                    type: array
                  rootCause:
                    description: RootCause is the most likely human-readable cause
                      inferred from logs and events.
                    type: string
                  significantLogs:
                    description: SignificantLogs contains the most relevant log lines
                      grouped by component.
                    items:
                      description: DiagnosticLogExcerpt contains selected log lines
                        for one preview component.
                      properties:
                        component:
                          description: Component identifies the Preview component
                            that produced the logs.
                          type: string
                        lines:
                          description: Lines contains selected significant log lines.
                          items:
                            type: string
                          type: array
                        source:
                          description: Source identifies the Kubernetes object or
                            container that produced the logs.
                          type: string
                      type: object
                    type: array
                type: object
              expiresAt:
                description: ExpiresAt is when this environment will be auto-deleted
                format: date-time
                type: string
              github:
                description: GitHub describes the latest GitHub Deployment or PR notification.
                properties:
                  commentId:
