# This rule is not used by the project cellenza-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to platform.company.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cellenza-operator
    app.kubernetes.io/managed-by: kustomize
  name: cellenza-viewer-role
rules:
- apiGroups:
  - platform.company.io
  resources:
  - cellenzas
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - platform.company.io
  resources:
  - cellenzas/status
  verbs:
  - get
