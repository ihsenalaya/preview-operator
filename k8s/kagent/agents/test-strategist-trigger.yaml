---
# CronJob that fires the test-strategist-agent every 60 seconds.
#
# The agent's system prompt already knows how to find Pending TestPlans via
# k8s_get_resources. This CronJob simply wakes it up so the controller never
# needs an HTTP client: the controller creates a stub TestPlan, this CronJob
# pokes the agent, the agent fills the plan, the controller's TestPlan watch
# triggers reconciliation.
#
# Architecture principle: the Preview controller has zero knowledge of the
# agent. They communicate exclusively through TestPlan CRDs.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: test-strategist-trigger
  namespace: kagent-system
  labels:
    app.kubernetes.io/component: test-strategist
    app.kubernetes.io/part-of: preview-operator
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 55
      template:
        metadata:
          labels:
            app.kubernetes.io/component: test-strategist-trigger
            app.kubernetes.io/part-of: preview-operator
        spec:
          restartPolicy: Never
          serviceAccountName: kagent-test-strategist
          containers:
            - name: trigger
              image: curlimages/curl:8.7.1
              command:
                - sh
                - -c
                - |
                  curl -sf \
                    -X POST \
                    -H 'Content-Type: application/json' \
                    -d '{"jsonrpc":"2.0","method":"message/send","id":"cron-trigger","params":{"message":{"role":"user","messageId":"cron","parts":[{"type":"text","text":"Check for Pending TestPlans across all namespaces. For each one, read the referenced Preview (spec.changeContext, spec.testStrategy), read the last 50 ReconcileEvents in the same namespace for historical signal, then fill the TestPlan spec with your test selection decision (mustRun, canSkip, confidence, rationale). Set status.phase=Ready when done."}]}}}' \
                    http://test-strategist-agent.kagent-system.svc.cluster.local:8080
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 32Mi
