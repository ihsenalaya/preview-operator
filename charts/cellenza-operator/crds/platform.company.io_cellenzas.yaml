---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: cellenzas.platform.company.io
spec:
  group: platform.company.io
  names:
    kind: Cellenza
    listKind: CellenzaList
    plural: cellenzas
    shortNames:
    - cz
    singular: cellenza
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.branch
      name: Branch
      type: string
    - jsonPath: .spec.resourceTier
      name: Tier
      type: string
    - jsonPath: .status.url
      name: URL
      type: string
    - jsonPath: .status.expiresAt
      name: Expires
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Cellenza is the Schema for the preview environment operator
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: CellenzaSpec defines the desired state
            properties:
              aiEnrichment:
                description: AIEnrichment configures AI-powered seed data and test
                  generation after deployment.
                properties:
                  apiSecretRef:
                    description: 'APISecretRef points to a Secret containing the AI
                      provider API key (key: "api-key").'
                    properties:
                      key:
                        description: Key is the Secret data key. Defaults to "api-key".
                        type: string
                      name:
                        description: Name is the Secret name.
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace is the Secret namespace. Defaults to
                          cellenza-operator-system.
                        type: string
                    required:
                    - name
                    type: object
                  enabled:
                    default: false
                    description: Enabled controls whether AI enrichment runs after
                      the environment is ready.
                    type: boolean
                  model:
                    default: gpt-4o-mini
                    description: Model is the AI model to use (e.g. "gpt-4o-mini",
                      "gpt-4o").
                    type: string
                  seed:
                    description: Seed configures AI seed data generation and execution.
                    properties:
                      enabled:
                        default: false
                        description: Enabled controls whether this task runs.
                        type: boolean
                      image:
                        description: |-
                          Image is the container image used to run the task.
                          Defaults to "postgres:15-alpine" for seed, "python:3.12-slim" for tests.
                        type: string
                    type: object
                  tests:
                    description: Tests configures AI test generation and execution.
                    properties:
                      enabled:
                        default: false
                        description: Enabled controls whether this task runs.
                        type: boolean
                      image:
                        description: |-
                          Image is the container image used to run the task.
                          Defaults to "postgres:15-alpine" for seed, "python:3.12-slim" for tests.
                        type: string
                    type: object
                type: object
              approvedBy:
                description: ApprovedBy is the user who approved this environment
                  (required when RequiresApproval=true)
                type: string
              branch:
                description: Branch is the git branch name for this preview environment
                minLength: 1
                type: string
              database:
                description: Database configures an ephemeral PostgreSQL instance
                  for this environment
                properties:
                  databaseName:
                    default: appdb
                    description: DatabaseName is the logical database created inside
                      PostgreSQL
                    type: string
                  enabled:
                    default: false
                    description: Enabled controls whether a PostgreSQL instance is
                      provisioned alongside the app
                    type: boolean
                  migration:
                    description: |-
                      Migration configures an optional one-shot Job that runs before the app is deployed.
                      The operator injects POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB and DATABASE_URL.
                    properties:
                      args:
                        description: Args are optional arguments passed to the command.
                        items:
                          type: string
                        type: array
                      command:
                        description: Command is the entrypoint command for the task.
                        items:
                          type: string
                        type: array
                      enabled:
                        default: false
                        description: Enabled controls whether this database task is
                          executed.
                        type: boolean
                      image:
                        description: Image is the container image used to run the
                          task. When empty, spec.image is used.
                        type: string
                    type: object
                  resetRequested:
                    description: |-
                      ResetRequested triggers a database reset: migration and seed jobs are deleted and re-run.
                      The operator clears this flag automatically after the reset is initiated.
                    type: boolean
                  seed:
                    description: |-
                      Seed configures an optional one-shot Job that runs after migration and before the app is deployed.
                      The operator injects POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB and DATABASE_URL.
                    properties:
                      args:
                        description: Args are optional arguments passed to the command.
                        items:
                          type: string
                        type: array
                      command:
                        description: Command is the entrypoint command for the task.
                        items:
                          type: string
                        type: array
                      enabled:
                        default: false
                        description: Enabled controls whether this database task is
                          executed.
                        type: boolean
                      image:
                        description: Image is the container image used to run the
                          task. When empty, spec.image is used.
                        type: string
                    type: object
                  version:
                    default: "15"
                    description: Version is the PostgreSQL major version to use (e.g.
                      "15", "16")
                    type: string
                type: object
              github:
                description: GitHub configures optional GitHub Deployment and pull
                  request updates.
                properties:
                  commentOnReady:
                    default: false
                    description: CommentOnReady controls whether the controller comments
                      on the PR when the preview is ready.
                    type: boolean
                  deploymentId:
                    description: DeploymentID is the GitHub Deployment id to update.
                    format: int64
                    type: integer
                  enabled:
                    default: false
                    description: Enabled controls whether the controller sends updates
                      to GitHub.
                    type: boolean
                  environment:
                    description: Environment is the GitHub Deployment environment
                      name (for example "pr-42").
                    type: string
                  owner:
                    description: Owner is the GitHub repository owner or organization.
                    type: string
                  repo:
                    description: Repo is the GitHub repository name.
                    type: string
                  tokenSecretRef:
                    description: TokenSecretRef points to a Secret containing a GitHub
                      token.
                    properties:
                      key:
                        description: Key is the Secret data key containing the token.
                          Defaults to "token".
                        type: string
                      name:
                        description: Name is the Secret name.
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace is the Secret namespace. When empty,
                          the controller namespace is used.
                        type: string
                    required:
                    - name
                    type: object
                type: object
              image:
                description: Image is the container image to deploy
                minLength: 1
                type: string
              prNumber:
                description: PRNumber is the pull request number
                type: integer
              replicas:
                default: 1
                description: Replicas for the preview deployment
                format: int32
                maximum: 5
                minimum: 1
                type: integer
              requiresApproval:
                default: false
                description: RequiresApproval blocks provisioning until ApprovedBy
                  is set
                type: boolean
              resourceTier:
                default: medium
                description: ResourceTier controls CPU/Memory quotas
                enum:
                - small
                - medium
                - large
                type: string
              telemetry:
                description: Telemetry configures application observability integration.
                properties:
                  autoInstrumentation:
                    description: AutoInstrumentation configures OpenTelemetry Operator
                      auto-instrumentation.
                    properties:
                      goTargetExecutable:
                        description: |-
                          GoTargetExecutable is required by OpenTelemetry Go auto-instrumentation.
                          It must point to the executable inside the application container.
                        type: string
                      instrumentationRef:
                        description: |-
                          InstrumentationRef is the Instrumentation resource used by the OpenTelemetry Operator.
                          It can be "true", a name in the app namespace, or "namespace/name".
                          When empty, the controller uses "true".
                        type: string
                      language:
                        description: Language is the runtime to auto-instrument.
                        enum:
                        - python
                        - java
                        - nodejs
                        - dotnet
                        - go
                        - sdk
                        type: string
                      pythonPlatform:
                        description: |-
                          PythonPlatform selects the Python auto-instrumentation platform.
                          Use "musl" for Alpine-based Python images when supported by the OpenTelemetry Operator.
                        enum:
                        - glibc
                        - musl
                        type: string
                    required:
                    - language
                    type: object
                  enabled:
                    default: false
                    description: Enabled controls whether telemetry settings are added
                      to the app Pod template.
                    type: boolean
                  serviceName:
                    description: |-
                      ServiceName sets OTEL_SERVICE_NAME for the application.
                      When empty, the controller uses "cellenza-<resource-name>".
                    type: string
                type: object
              ttl:
                default: 48h
                description: TTL is the time-to-live duration (e.g. "48h", "24h",
                  "72h")
                pattern: ^[0-9]+(h|m)$
                type: string
            required:
            - branch
            - image
            - prNumber
            type: object
          status:
            description: CellenzaStatus defines the observed state
            properties:
              aiEnrichment:
                description: AIEnrichment describes the observed AI enrichment state.
                properties:
                  completedAt:
                    description: CompletedAt is when the enrichment completed.
                    format: date-time
                    type: string
                  error:
                    description: Error stores the latest enrichment error message.
                    type: string
                  phase:
                    description: 'Phase: Pending | Generating | Running | Succeeded
                      | Failed'
                    type: string
                  seedStatus:
                    description: 'SeedStatus: Skipped | Running | Succeeded | Failed'
                    type: string
                  summary:
                    description: Summary is a human-readable enrichment summary for
                      the PR comment.
                    type: string
                  testResults:
                    description: TestResults contains stdout lines from the test job.
                    items:
                      type: string
                    type: array
                  testsStatus:
                    description: 'TestsStatus: Skipped | Running | Succeeded | Failed'
                    type: string
                type: object
              conditions:
                description: Conditions represent the latest available observations
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              database:
                description: Database describes the observed PostgreSQL and database
                  task state.
                properties:
                  databaseName:
                    description: DatabaseName is the logical PostgreSQL database name.
                    type: string
                  host:
                    description: Host is the in-cluster PostgreSQL service hostname.
                    type: string
                  migration:
                    description: Migration is the latest observed migration task state.
                    type: string
                  ready:
                    description: Ready is true when the database resources and configured
                      tasks are complete.
                    type: boolean
                  secretName:
                    description: SecretName is the Secret containing database credentials.
                    type: string
                  seed:
                    description: Seed is the latest observed seed task state.
                    type: string
                type: object
              databaseSecretName:
                description: DatabaseSecretName is the name of the Secret holding
                  PostgreSQL credentials (when database is enabled)
                type: string
              diagnostics:
                description: Diagnostics describes the latest operator-generated troubleshooting
                  summary.
                properties:
                  component:
                    description: Component identifies the component most likely responsible
                      for the issue.
                    type: string
                  confidence:
                    description: 'Confidence estimates how strong the diagnostic signal
                      is: low, medium, or high.'
                    type: string
                  debugCommands:
                    description: DebugCommands contains useful kubectl commands for
                      troubleshooting.
                    items:
                      type: string
                    type: array
                  lastEvents:
                    description: LastEvents contains recent warning events related
                      to the preview namespace.
                    items:
                      type: string
                    type: array
                  message:
                    description: Message is a concise human-readable summary.
                    type: string
                  podLogs:
                    description: PodLogs contains the last lines of the crashed application
                      pod.
                    items:
                      type: string
                    type: array
                  reason:
                    description: Reason is a short machine-readable reason.
                    type: string
                  recommendations:
                    description: Recommendations contains suggested next actions for
                      the developer.
                    items:
                      type: string
                    type: array
                  rootCause:
                    description: RootCause is the most likely human-readable cause
                      inferred from logs and events.
                    type: string
                  significantLogs:
                    description: SignificantLogs contains the most relevant log lines
                      grouped by component.
                    items:
                      description: DiagnosticLogExcerpt contains selected log lines
                        for one preview component.
                      properties:
                        component:
                          description: Component identifies the Cellenza component
                            that produced the logs.
                          type: string
                        lines:
                          description: Lines contains selected significant log lines.
                          items:
                            type: string
                          type: array
                        source:
                          description: Source identifies the Kubernetes object or
                            container that produced the logs.
                          type: string
                      type: object
                    type: array
                type: object
              expiresAt:
                description: ExpiresAt is when this environment will be auto-deleted
                format: date-time
                type: string
              github:
                description: GitHub describes the latest GitHub Deployment or PR notification.
                properties:
                  commentId:
                    description: CommentID is the GitHub issue comment id created
                      for the PR.
                    format: int64
                    type: integer
                  deploymentState:
                    description: DeploymentState is the last GitHub Deployment state
                      sent by the controller.
                    type: string
                  lastEnvironmentUrl:
                    description: LastEnvironmentURL is the URL sent to GitHub.
                    type: string
                  lastError:
                    description: LastError stores the latest non-blocking GitHub notification
                      error.
                    type: string
                  lastNotifiedAt:
                    description: LastNotifiedAt is when the latest GitHub notification
                      was sent.
                    format: date-time
                    type: string
                  lastNotifiedPhase:
                    description: LastNotifiedPhase is the Cellenza phase corresponding
                      to the last notification.
                    type: string
                type: object
              namespaceName:
                description: NamespaceName is the dedicated namespace created for
                  this env
                type: string
              observedGeneration:
                description: ObservedGeneration helps detect spec changes
                format: int64
                type: integer
              phase:
                description: Phase is the current lifecycle phase
                type: string
              readyAt:
                description: ReadyAt is the timestamp when the environment first reached
                  the Running phase.
                format: date-time
                type: string
              url:
                description: URL is the ingress URL of the preview environment
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
