{{- if .Values.webhook.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "cellenza-operator.fullname" . }}-mutating-webhook
  labels:
    {{- include "cellenza-operator.labels" . | nindent 4 }}
  {{- if .Values.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "cellenza-operator.fullname" . }}-webhook-cert
  {{- end }}
webhooks:
- admissionReviewVersions: [v1]
  clientConfig:
    service:
      name: {{ include "cellenza-operator.webhookServiceName" . }}
      namespace: {{ .Release.Namespace }}
      path: /mutate-platform-company-io-v1alpha1-cellenza
  failurePolicy: Fail
  name: mcellenza.kb.io
  rules:
  - apiGroups: [platform.company.io]
    apiVersions: [v1alpha1]
    operations: [CREATE, UPDATE]
    resources: [cellenzas]
  sideEffects: None
{{- end }}
