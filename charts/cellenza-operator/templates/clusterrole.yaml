apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cellenza-operator.fullname" . }}-manager-role
  labels:
    {{- include "cellenza-operator.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: [configmaps, namespaces, resourcequotas, secrets, services]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [pods/log]
  verbs: [get]
- apiGroups: [""]
  resources: [events]
  verbs: [get, list, watch]
- apiGroups: [apps]
  resources: [deployments]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [batch]
  resources: [jobs]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [networking.k8s.io]
  resources: [ingresses]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [platform.company.io]
  resources: [cellenzas]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [platform.company.io]
  resources: [cellenzas/finalizers]
  verbs: [update]
- apiGroups: [platform.company.io]
  resources: [cellenzas/status]
  verbs: [get, patch, update]
