                x-kubernetes-map-type: atomic
              selectedTests:
                description: SelectedTests is the final set of tests chosen after
                  applying policy.
                items:
                  description: TestSelector identifies a specific test or group of
                    tests within a suite.
                  properties:
                    name:
                      default: '*'
                      description: Name is the test or scenario identifier. Use "*"
                        to select all tests in a suite.
                      type: string
                    reason:
                      description: Reason is a human-readable explanation for why
                        this test was selected or skipped.
                      type: string
                    suite:
                      description: Suite is the test category.
                      enum:
                      - smoke
                      - contract
                      - regression
                      - migration
                      - e2e
                      - load
                      type: string
                  required:
                  - suite
                  type: object
                type: array
              startedAt:
                description: StartedAt is when the controller began launching test
                  jobs.
                format: date-time
                type: string
              testPlanRef:
                description: TestPlanRef references the TestPlan that was accepted
                  for this run.
                properties:
                  apiVersion:
                    description: API version of the referent.
