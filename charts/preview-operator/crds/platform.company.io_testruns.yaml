                  kind:
                    description: |-
                      Kind of the referent.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
                    type: string
                  name:
                    description: |-
                      Name of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
                    type: string
                  resourceVersion:
                    description: |-
                      Specific resourceVersion to which this reference is made, if any.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#concurrency-control-and-consistency
                    type: string
                  uid:
                    description: |-
                      UID of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#uids
                    type: string
                type: object
                x-kubernetes-map-type: atomic
            required:
            - previewRef
            type: object
          status:
            description: TestRunStatus describes the observed state of a TestRun.
            properties:
              finishedAt:
                description: FinishedAt is when all test jobs completed.
                format: date-time
                type: string
              phase:
                description: Phase is the current lifecycle phase.
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                - PartiallyFailed
                type: string
              results:
                description: Results contains per-test outcomes appended as jobs complete.
                items:
                  description: TestRunResult holds the outcome of one test execution
                    within a TestRun.
                  properties:
                    durationSeconds:
                      description: DurationSeconds is how long the test took.
                      type: integer
                    junitURL:
                      description: JUnitURL is a link to the JUnit XML report.
                      type: string
                    logsURL:
                      description: LogsURL is a link to the raw test logs.
                      type: string
                    name:
                      description: Name is the test identifier.
                      type: string
                    status:
                      description: 'Status is the outcome: Pending | Running | Succeeded
                        | Failed | Skipped.'
                      type: string
                    suite:
                      description: Suite is the test category.
