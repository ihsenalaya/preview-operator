---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: testplans.platform.company.io
spec:
  group: platform.company.io
  names:
    kind: TestPlan
    listKind: TestPlanList
    plural: testplans
    shortNames:
    - tp
    singular: testplan
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.confidence
      name: Confidence
      type: integer
    - jsonPath: .spec.generatedBy
      name: GeneratedBy
      type: string
    - jsonPath: .status.acceptedByController
      name: Accepted
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          TestPlan is the output of the test-strategist agent. The agent writes it;
          the controller reads it and decides whether to accept or fall back to FullSuite.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TestPlanSpec defines the desired state of a TestPlan.
            properties:
              agentName:
                description: AgentName is the kagent agent that produced this plan
                  (when GeneratedBy=Agent).
                type: string
              agentVersion:
                description: AgentVersion is the version of the agent that produced
                  this plan.
                type: string
              canSkip:
                description: CanSkip contains tests the agent considers safe to skip
                  for this diff.
                items:
                  description: TestSelector identifies a specific test or group of
                    tests within a suite.
                  properties:
                    name:
                      default: '*'
                      description: Name is the test or scenario identifier. Use "*"
                        to select all tests in a suite.
                      type: string
                    reason:
                      description: Reason is a human-readable explanation for why
                        this test was selected or skipped.
                      type: string
                    suite:
                      description: Suite is the test category.
                      enum:
                      - smoke
                      - contract
                      - regression
                      - migration
                      - e2e
                      - load
                      type: string
                  required:
                  - suite
                  type: object
                type: array
              commitSHA:
                description: |-
                  CommitSHA is the head commit this plan was produced for.
                  The controller marks the plan Stale when the Preview's commit SHA changes.
                type: string
              confidence:
                description: Confidence is the agent's self-reported confidence score
                  (0-100).
                maximum: 100
                minimum: 0
                type: integer
              correlationID:
                description: CorrelationID is propagated across all CRs related to
                  one reconcile cycle.
                type: string
              estimatedDurationSeconds:
                description: EstimatedDurationSeconds is the agent's estimate of total
                  test time.
                type: integer
              expiresAt:
                description: ExpiresAt is when this plan becomes invalid (typically
                  when the commit SHA changes).
                format: date-time
                type: string
              generatedAt:
                description: GeneratedAt is when the agent produced this plan.
                format: date-time
                type: string
              generatedBy:
                description: GeneratedBy identifies who produced this plan.
                enum:
                - Agent
                - Manual
                - FallbackPolicy
                type: string
              mustRun:
                description: MustRun contains tests the agent considers mandatory
                  for this diff.
                items:
                  description: TestSelector identifies a specific test or group of
                    tests within a suite.
                  properties:
                    name:
                      default: '*'
                      description: Name is the test or scenario identifier. Use "*"
                        to select all tests in a suite.
                      type: string
                    reason:
                      description: Reason is a human-readable explanation for why
                        this test was selected or skipped.
                      type: string
                    suite:
                      description: Suite is the test category.
                      enum:
                      - smoke
                      - contract
                      - regression
                      - migration
                      - e2e
                      - load
                      type: string
                  required:
                  - suite
                  type: object
                type: array
              previewRef:
                description: PreviewRef references the Preview that requested this
                  plan.
                properties:
                  apiVersion:
                    description: API version of the referent.
                    type: string
                  fieldPath:
                    description: |-
                      If referring to a piece of an object instead of an entire object, this string
                      should contain a valid JSON/Go field access statement, such as desiredState.manifest.containers[2].
                      For example, if the object reference is to a container within a pod, this would take on a value like:
                      "spec.containers{name}" (where "name" refers to the name of the container that triggered
                      the event) or if no container name is specified "spec.containers[2]" (container with
                      index 2 in this pod). This syntax is chosen only to have some well-defined way of
                      referencing a part of an object.
                    type: string
                  kind:
                    description: |-
                      Kind of the referent.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
                    type: string
                  name:
                    description: |-
                      Name of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
                    type: string
                  resourceVersion:
                    description: |-
                      Specific resourceVersion to which this reference is made, if any.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#concurrency-control-and-consistency
                    type: string
                  uid:
                    description: |-
                      UID of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#uids
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              rationale:
                description: |-
                  Rationale is a human-readable explanation of the test plan decision,
                  included verbatim in the PR comment.
                type: string
              shouldRun:
                description: ShouldRun contains tests the agent recommends but does
                  not consider mandatory.
                items:
                  description: TestSelector identifies a specific test or group of
                    tests within a suite.
                  properties:
                    name:
                      default: '*'
                      description: Name is the test or scenario identifier. Use "*"
                        to select all tests in a suite.
                      type: string
                    reason:
                      description: Reason is a human-readable explanation for why
                        this test was selected or skipped.
                      type: string
                    suite:
                      description: Suite is the test category.
                      enum:
                      - smoke
                      - contract
                      - regression
                      - migration
                      - e2e
                      - load
                      type: string
                  required:
                  - suite
                  type: object
                type: array
            required:
            - previewRef
            type: object
          status:
            description: TestPlanStatus describes the observed state of a TestPlan.
            properties:
              acceptedAt:
                description: AcceptedAt is when the controller accepted this plan.
                format: date-time
                type: string
              acceptedByController:
                description: AcceptedByController is true when the controller has
                  validated and accepted this plan.
                type: boolean
              phase:
                description: Phase is the current lifecycle phase.
                enum:
                - Pending
                - Ready
                - Stale
                - Rejected
                type: string
              rejectionReason:
                description: RejectionReason explains why the controller rejected
                  this plan.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
