replicaCount: 1

image:
  repository: ghcr.io/ihsenalaya/preview-operator
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  name: ""

leaderElect: true

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

webhook:
  enabled: true
  port: 9443

certManager:
  enabled: true
  issuerName: ""

metrics:
  port: 8443

ai:
  apiURL: "https://models.inference.ai.azure.com"
  systemPrompt: ""

# Base domain for preview URLs.
# Each PR gets: http://pr-<N>.<previewDomain>
# Requires a wildcard DNS record: *.<previewDomain> → Istio Gateway or Ingress IP
# Example: "preview.ihsenalaya.xyz"
previewDomain: ""

nodeSelector: {}
tolerations: []
affinity: {}
